server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    # API calls go to the Spring Boot container.
    location /api/ {
        proxy_pass http://backend:8080;
    }

    # Single-page app: unknown paths load index.html and React Router takes over.
    location / {
        try_files $uri /index.html;
    }
}
