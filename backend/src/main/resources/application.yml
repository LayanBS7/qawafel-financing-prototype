server:
  port: 8080

spring:
  application:
    name: financing-prototype
  datasource:
    # In-memory database: data resets on restart. Fine for a prototype; see README.
    url: jdbc:h2:mem:financing;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  # Origins allowed to call the API from a browser (the React dev server).
  cors-origins: http://localhost:5173,http://localhost:3000
